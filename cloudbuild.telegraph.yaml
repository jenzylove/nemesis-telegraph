# Telegraph Track 3 case runtime. This is a SEPARATE Cloud Run service from the
# submitted nemesis-api-staging deployment, which must keep running untouched.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build","-t","us-central1-docker.pkg.dev/$PROJECT_ID/nemesis/telegraph-api:$BUILD_ID","backend"]
  - name: gcr.io/cloud-builders/docker
    args: ["push","us-central1-docker.pkg.dev/$PROJECT_ID/nemesis/telegraph-api:$BUILD_ID"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - nemesis-telegraph-api
      - --image
      - us-central1-docker.pkg.dev/$PROJECT_ID/nemesis/telegraph-api:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --service-account
      - nemesis-telegraph@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars
      - GIT_SHA=$COMMIT_SHA,APP_ENV=production,GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GEMINI_MODEL=${_GEMINI_MODEL},ADK_APP_NAME=nemesis,FIRESTORE_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE=${_FIRESTORE_DATABASE},FIRESTORE_CASES_COLLECTION=cases,CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS},RPC_TIMEOUT_SECONDS=20,PUBSUB_TOPIC=${_PUBSUB_TOPIC},CLOUD_RUN_SERVICE_URL=${_SERVICE_URL},INTERNAL_SERVICE_ACCOUNT=nemesis-telegraph@$PROJECT_ID.iam.gserviceaccount.com,MONITORING_MAX_BLOCKS=20,TELEGRAPH_GATEWAY_URL=${_TELEGRAPH_GATEWAY_URL},TELEGRAPH_RECEIPTS_COLLECTION=telegraph_receipts,TELEGRAPH_TIMEOUT_SECONDS=60,ALCHEMY_DISCOVERY_MAX_PAGES=20,BITQUERY_ENDPOINT=https://streaming.bitquery.io/graphql,DISCOVERY_CANDIDATE_LIMIT=100,GOPLUS_BASE_URL=https://api.gopluslabs.io/api/v1,CHAINABUSE_BASE_URL=https://api.chainabuse.com/v0
      - --set-secrets
      - ETHEREUM_RPC_URL=nemesis-telegraph-ethereum-rpc:latest,BASE_RPC_URL=nemesis-telegraph-base-rpc:latest,ALCHEMY_API_KEY=nemesis-telegraph-alchemy-api-key:latest,BITQUERY_ACCESS_TOKEN=nemesis-telegraph-bitquery-token:latest,CHAINABUSE_API_KEY=nemesis-telegraph-chainabuse-api-key:latest,TELEGRAPH_INTERNAL_TOKEN=nemesis-telegraph-internal-token:latest
      - --min-instances
      - "0"
      - --max-instances
      - "3"
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --timeout
      - "300"
      - --concurrency
      - "8"
substitutions:
  _REGION: us-central1
  # Separate Firestore database and Pub/Sub topic. The submitted deployment
  # runs on (default) and nemesis-case-events and must keep both to itself.
  _FIRESTORE_DATABASE: nemesis-telegraph
  _PUBSUB_TOPIC: nemesis-telegraph-case-events
  _TELEGRAPH_GATEWAY_URL: https://nemesis-telegraph-gateway-h7bnd6kzfq-uc.a.run.app
  _GEMINI_MODEL: gemini-3.5-flash
  _CORS_ALLOWED_ORIGINS: https://nemesis-telegraph-web-h7bnd6kzfq-uc.a.run.app
  _SERVICE_URL: https://nemesis-telegraph-api-h7bnd6kzfq-uc.a.run.app
options:
  logging: CLOUD_LOGGING_ONLY
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/nemesis/telegraph-api:$BUILD_ID
