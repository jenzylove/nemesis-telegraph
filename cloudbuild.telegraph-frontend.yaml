# Telegraph Track 3 frontend. Separate service and separate image from the
# submitted nemesis-web deployment, and it only ever updates CORS on the
# Telegraph API. Nothing here touches the original submission.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.frontend
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/nemesis/telegraph-web:$BUILD_ID
      - --build-arg
      - NEXT_PUBLIC_NEMESIS_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/nemesis/telegraph-web:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - nemesis-telegraph-web
      - --image
      - us-central1-docker.pkg.dev/$PROJECT_ID/nemesis/telegraph-web:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --min-instances
      - "0"
      - --max-instances
      - "3"
      - --memory
      - 512Mi
      - --cpu
      - "1"
      - --timeout
      - "300"
      - --concurrency
      - "40"
      - --set-env-vars
      - NEXT_PUBLIC_NEMESIS_API_URL=${_API_URL},GIT_SHA=${_GIT_SHA}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        FRONTEND_URL="$(gcloud run services describe nemesis-telegraph-web --region '${_REGION}' --format='value(status.url)')"
        test -n "$${FRONTEND_URL}"
        gcloud run services update nemesis-telegraph-api \
          --region '${_REGION}' \
          --update-env-vars "^@^CORS_ALLOWED_ORIGINS=$${FRONTEND_URL}"
        echo "PUBLIC_FRONTEND_URL=$${FRONTEND_URL}"

substitutions:
  _REGION: us-central1
  # Set at submit time so the running frontend is traceable to a commit.
  _GIT_SHA: unknown
  _API_URL: https://nemesis-telegraph-api-h7bnd6kzfq-uc.a.run.app
  # Firebase web config. These are public client identifiers, not secrets:
  # they ship in the browser bundle by design and authorize nothing on their
  # own. Access is enforced by Firebase Auth and by the API verifying every
  # bearer token server-side. Same project as the original deployment, so
  # accounts work across both; nothing about that project was modified.
  _FIREBASE_API_KEY: "AIzaSyBqiEYdG89FjOo4IybroYyZ_y3DD1CkLFw"
  _FIREBASE_AUTH_DOMAIN: "nemesis-506114.firebaseapp.com"
  _FIREBASE_PROJECT_ID: "nemesis-506114"
  _FIREBASE_APP_ID: "1:336543907032:web:3cbad6a15c63980add6bad"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/nemesis/telegraph-web:$BUILD_ID
